<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1020" />
    <title>MingSky Astrology</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at top, rgba(127, 180, 167, 0.2), transparent 38%),
          linear-gradient(180deg, #09121d, #0b1020 65%, #0c1723);
        color: #f4f8f6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card {
        width: min(92vw, 420px);
        border-radius: 8px;
        padding: 28px 24px;
        background: rgba(11, 16, 32, 0.78);
        border: 1px solid rgba(127, 180, 167, 0.18);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.22);
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.12em;
        color: rgba(234, 245, 241, 0.64);
        text-transform: uppercase;
      }
      h1 {
        margin: 12px 0 10px;
        font-size: 28px;
        line-height: 1.15;
      }
      p {
        margin: 0;
        color: rgba(234, 245, 241, 0.82);
        line-height: 1.7;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">MingSky Astrology</div>
      <h1>网络暂时断开了</h1>
      <p>先休息一会儿。等网络回来，你就能继续查看明空星占的报告与解读。</p>
    </main>
  </body>
</html>
